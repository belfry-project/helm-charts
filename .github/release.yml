# Categories for GitHub's generated release notes, based on pull request labels
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Breaking changes
      labels: [breaking]
    - title: Security and end-of-life software replaced
      labels: [security]
    - title: Fixes
      labels: [fix]
    - title: Features
      labels: [feature]
    - title: Dependency updates
      labels: [dependencies]
    - title: Builds and CI
      labels: [build]
    - title: Documentation
      labels: [docs]
    - title: Other changes
      labels: ["*"]
